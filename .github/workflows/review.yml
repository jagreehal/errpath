name: errpath review

# Runs ./action.yml on this repo's own pull requests, using the CLI built from
# the branch under review.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: errpath-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build
      - uses: ./
        with:
          cli: target/debug/cargo-errpath
