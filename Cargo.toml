[package]
name = "cargo-errpath"
version = "0.1.0"
edition = "2024"
description = "See how a Rust PR changes error propagation, recovery and panic paths"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/jagreehal/errpath"
keywords = ["cargo", "review", "error-handling", "static-analysis", "panic"]
categories = ["development-tools::cargo-plugins", "development-tools"]
exclude = ["docs/"]

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3.0.9", features = ["full", "visit"] }
